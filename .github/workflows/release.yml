name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    permissions: 
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure Rust for F-Droid style build
        run: |
          cd rust
          cargo vendor vendor
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"
          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"
          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"
          [source.crates-io]
          replace-with = "vendored-sources"
          [source.vendored-sources]
          directory = "vendor"
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release Split APKs
        run: ./gradlew assembleRelease -PsplitApks=true -PrustTargets=arm64,arm,x86,x86_64

      - name: Sign APKs
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/build/outputs/apk/release/signingKey.jks
            for apk in app/build/outputs/apk/release/*-unsigned.apk; do
              [ -f "$apk" ] || continue
              out="${apk%-unsigned.apk}-signed.apk"
              "$APKSIGNER" sign \
                --ks app/build/outputs/apk/release/signingKey.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "$out" "$apk"
            done
          else
            echo "No repository keystore secret configured; generating release key for APK signing..."
            keytool -genkeypair -v -keystore app/build/outputs/apk/release/release.jks \
              -alias theorem -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass theorem123 -keypass theorem123 \
              -dname "CN=Theorem Neural Voice, O=Fundaments, C=US"
            for apk in app/build/outputs/apk/release/*-unsigned.apk; do
              [ -f "$apk" ] || continue
              out="${apk%-unsigned.apk}-signed.apk"
              "$APKSIGNER" sign \
                --ks app/build/outputs/apk/release/release.jks \
                --ks-key-alias theorem \
                --ks-pass pass:theorem123 \
                --key-pass pass:theorem123 \
                --out "$out" "$apk"
            done
          fi

      - name: Clean Ref Name
        id: clean_ref
        run: |
          CLEAN_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "clean_ref_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Rename Signed Assets
        run: |
          mkdir -p app/build/outputs/apk/release/dist
          cd app/build/outputs/apk/release
          for apk in *-signed.apk; do
            [ -f "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/^app-(.*)-release-signed\.apk$/\1/' | sed -E 's/^app-release-signed\.apk$/universal/')
            cp "$apk" "dist/Theorem-Neural-Voice-${{ steps.clean_ref.outputs.clean_ref_name }}-${abi}.apk"
          done
          ls -la dist/

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Theorem-Neural-Voice-Build-${{ steps.clean_ref.outputs.clean_ref_name }}
          path: app/build/outputs/apk/release/dist/*.apk
          if-no-files-found: ignore

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/dist/*.apk
          fail_on_unmatched_files: true
